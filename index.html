<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TTWO</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
  .name { position: absolute; top: 6vh; left: 0; right: 0; text-align: center;
    color: #8a8a8a; font-size: 6.5vh; letter-spacing: .25em; text-transform: uppercase; }
  .price { font-size: 20vw; font-weight: 700; line-height: 1; color: #8a8a8a;
    font-variant-numeric: tabular-nums; transition: color .4s; }
  .price.up { color: #00d26a; }
  .price.down { color: #ff3b3b; }
  .closed { margin-top: 3vh; color: #8a8a8a; font-size: 3.5vh; letter-spacing: .3em;
    text-transform: uppercase; visibility: hidden; }
  .closed.show { visibility: visible; }
  .fs { position: fixed; top: 2.5vh; right: 2vw; background: transparent; color: #555;
    border: 1px solid #333; border-radius: 6px; font-size: 2.2vh; padding: .4em .8em;
    cursor: pointer; opacity: .7; transition: opacity .5s; }
  .fs:hover, .fs:focus { color: #aaa; border-color: #666; outline: none; opacity: 1; }
  .fs.hide { opacity: 0; pointer-events: none; }
  body.idle { cursor: none; }
  .mid { position: absolute; left: 0; right: 0; top: 45vh; transform: translateY(-50%); text-align: center; }
  .below { position: absolute; left: 0; right: 0; top: 100%; margin-top: 1vh; display: flex; justify-content: center; align-items: baseline; gap: 2.5vw; }
  .pct { font-size: 4.5vh; font-weight: 600; color: #8a8a8a; font-variant-numeric: tabular-nums; }
  .pct.up { color: #00d26a; }
  .pct.down { color: #ff3b3b; }
  .below .closed { margin-top: 0; }
  .below .closed:not(.show) { display: none; }
  .gta { position: absolute; left: 0; right: 0; bottom: 13vh; text-align: center; color: #b48cff; font-size: 6vh; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .05em; }
  .gta small { display: block; text-align: center; color: #6f5a99; font-size: 2.8vh; letter-spacing: .3em;
    text-transform: uppercase; margin-bottom: .4em; }
  .foot { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between;
    align-items: center; padding: 3vh 3vw; font-size: 3.8vh; color: #9aa7b4; }
  .status { display: flex; align-items: center; gap: .6em; }
  .dot { width: .8em; height: .8em; border-radius: 50%; background: #6b7785; }
  .dot.open { background: #2ecc71; box-shadow: 0 0 .6em #2ecc71; }
  .dot.ext { background: #f1c40f; }
  .clocks span { margin-left: 1.5em; }
  .upd { position: absolute; left: 0; right: 0; text-align: center; color: #5c5c5c; font-size: 2.4vh; pointer-events: none; }
  .clocks b { color: #e6edf3; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <div class="name">Take-Two Interactive · TTWO</div>
  <div class="mid">
    <div class="price" id="price">…</div>
    <div class="below">
      <div class="pct" id="pct"></div>
      <div class="closed" id="closed">Piață închisă</div>
    </div>
  </div>
  <div class="gta"><small>GTA VI în România</small><span id="gta">--</span></div>
</div>
<div class="foot">
  <div class="upd" id="upd">Ultimul update: —</div>
  <div class="status"><div class="dot" id="dot"></div><span id="status">—</span></div>
  <div class="clocks">
    <span>București <b id="roTime">--:--</b></span>
    <span>New York <b id="nyTime">--:--</b></span>
  </div>
</div>
<button class="fs" id="fs">⛶ Ecran complet</button>

<script>
  // ===== PUNE CHEIA DE LA FINNHUB AICI =====
  var KEY = "dbpk3t9r01qr0r9o046gdbpk3t9r01qr0r9o0470";
  // ==========================================

  var SYMBOL = "TTWO";
  var priceEl = document.getElementById("price");
  var closedEl = document.getElementById("closed");
  var marketOpen = null, session = null;

  // Prețul de referință fix: egal = gri, peste = verde, sub = roșu
  var base = 223.85;

  // Rezervă, dacă API-ul de status nu răspunde: ore NASDAQ (fără sărbători)
  function localMarketOpen() {
    var p = {};
    new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", weekday: "short",
      hour: "numeric", minute: "numeric", hour12: false })
      .formatToParts(new Date()).forEach(function (x) { p[x.type] = x.value; });
    if (p.weekday === "Sat" || p.weekday === "Sun") return false;
    var m = (parseInt(p.hour, 10) % 24) * 60 + parseInt(p.minute, 10);
    return m >= 570 && m < 960;
  }

  function render(p) {
    priceEl.textContent = "$" + p.toFixed(2);
    priceEl.className = "price";
    var ch = (p - base) / base * 100, pctEl = document.getElementById("pct");
    pctEl.textContent = (ch > 0 ? "+" : ch < 0 ? "−" : "") + Math.abs(ch).toFixed(2) + "%";
    pctEl.className = ch > 0 ? "pct up" : ch < 0 ? "pct down" : "pct";
    var open = (marketOpen === null) ? localMarketOpen() : (marketOpen && (!session || session === "regular"));
    closedEl.className = open ? "closed" : "closed show";
    if (!open) return;           // închis → gri
    if (p > base) priceEl.className = "price up";       // peste referință → verde
    else if (p < base) priceEl.className = "price down"; // sub referință → roșu
  }

  var last = null, lastWs = 0;
  var lastUpd = 0;
  function markUpdate() { lastUpd = Date.now(); showUpd(); }
  function showUpd() {
    var el = document.getElementById("upd");
    if (!lastUpd) { el.textContent = "Ultimul update: —"; return; }
    var t = Math.floor((Date.now() - lastUpd) / 1000);
    el.textContent = "Ultimul update: acum " + (t < 60 ? t + " s" : t < 3600 ? Math.floor(t / 60) + " min " + (t % 60) + " s" : Math.floor(t / 3600) + " h " + Math.floor(t % 3600 / 60) + " min");
  }
  setInterval(showUpd, 1000);

  // Preț în timp real: fiecare tranzacție TTWO vine instant prin WebSocket
  function connectWs() {
    if (KEY === "PUNE_CHEIA_AICI" || !window.WebSocket) return;
    var ws;
    try { ws = new WebSocket("wss://ws.finnhub.io?token=" + KEY); } catch (e) { setTimeout(connectWs, 10000); return; }
    ws.onopen = function () { ws.send(JSON.stringify({ type: "subscribe", symbol: SYMBOL })); };
    ws.onmessage = function (ev) {
      try {
        var m = JSON.parse(ev.data);
        if (m.type === "trade" && m.data && m.data.length) {
          var t = m.data[m.data.length - 1];
          if (t.p) { last = t.p; lastWs = Date.now(); render(last); markUpdate(); }
        }
      } catch (e) {}
    };
    ws.onclose = function () { setTimeout(connectWs, 5000); };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }
  function loadPrice() {
    if (KEY === "PUNE_CHEIA_AICI") { priceEl.style.fontSize = "5vh"; priceEl.textContent = "Lipsește cheia Finnhub"; return; }
    // Rezervă: dacă WebSocket-ul n-a trimis nimic în ultimele 15 s, ia prețul prin REST
    if (Date.now() - lastWs < 15000) return;
    fetch("https://finnhub.io/api/v1/quote?symbol=" + SYMBOL + "&token=" + KEY + "&_=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.c || Date.now() - lastWs < 15000) return;
        last = d.c;
        render(last); markUpdate();
      })
      .catch(function () {});
  }

  function loadStatus() {
    if (KEY === "PUNE_CHEIA_AICI") return;
    fetch("https://finnhub.io/api/v1/stock/market-status?exchange=US&token=" + KEY)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && typeof d.isOpen === "boolean") { marketOpen = d.isOpen; session = d.session || null; }
        footer();
        if (last !== null) render(last);
      })
      .catch(function () { marketOpen = null; });
  }

  // Buton ecran complet (dispare în fullscreen și după 5 s fără mișcare)
  var fsBtn = document.getElementById("fs"), idleT;
  function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement) || window.innerHeight >= screen.height - 2; }
  function toggleFs() {
    var el = document.documentElement;
    if (!isFs()) { (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el); }
    else { (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document); }
  }
  function wake() {
    document.body.classList.remove("idle");
    fsBtn.classList.toggle("hide", !!isFs());
    clearTimeout(idleT);
    idleT = setTimeout(function () { document.body.classList.add("idle"); fsBtn.classList.add("hide"); }, 5000);
  }
  fsBtn.addEventListener("click", toggleFs);
  document.addEventListener("mousemove", wake);
  document.addEventListener("keydown", function (e) { if ((e.key === "Enter" || e.keyCode === 13) && e.target !== fsBtn) toggleFs(); wake(); });
  document.addEventListener("fullscreenchange", wake);
  document.addEventListener("webkitfullscreenchange", wake);
  window.addEventListener("resize", wake);
  wake();

  // Footer: status bursă + ceasuri
  function hm(tz) { return new Date().toLocaleTimeString("ro-RO", { timeZone: tz, hour: "2-digit", minute: "2-digit" }); }
  function nyInfo() {
    var p = {};
    new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", weekday: "short", hour: "numeric", minute: "numeric", hour12: false })
      .formatToParts(new Date()).forEach(function (x) { p[x.type] = x.value; });
    return { we: p.weekday === "Sat" || p.weekday === "Sun", m: (parseInt(p.hour, 10) % 24) * 60 + parseInt(p.minute, 10) };
  }
  function footer() {
    document.getElementById("roTime").textContent = hm("Europe/Bucharest");
    document.getElementById("nyTime").textContent = hm("America/New_York");
    var dot = document.getElementById("dot"), st = document.getElementById("status");
    var ses = session;
    if (marketOpen === null) {
      var n = nyInfo();
      ses = n.we ? null : (n.m >= 570 && n.m < 960) ? "regular" : (n.m >= 240 && n.m < 570) ? "pre-market" : (n.m >= 960 && n.m < 1200) ? "post-market" : null;
    } else if (marketOpen && !ses) { ses = "regular"; }
    dot.className = "dot";
    if (ses === "regular") { st.textContent = "NASDAQ deschis"; dot.className = "dot open"; }
    else if (ses === "pre-market") { st.textContent = "Pre-market"; dot.className = "dot ext"; }
    else if (ses === "post-market") { st.textContent = "After-hours"; dot.className = "dot ext"; }
    else { st.textContent = "Bursa închisă"; }
  }
  footer(); setInterval(footer, 15000);

  // Countdown GTA VI: 19 noiembrie 2026, 00:00 ora României (UTC+2)
  var GTA = new Date("2026-11-19T00:00:00+02:00").getTime();
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function gta() {
    var d = Math.floor((GTA - Date.now()) / 1000), el = document.getElementById("gta");
    if (d <= 0) { el.textContent = "A apărut! 🎮"; return; }
    var z = Math.floor(d / 86400); d %= 86400;
    el.textContent = pad(z) + ":" + pad(Math.floor(d / 3600)) + ":" + pad(Math.floor(d % 3600 / 60)) + ":" + pad(d % 60);
  }
  gta(); setInterval(gta, 1000);

  loadStatus(); loadPrice(); connectWs();
  setInterval(loadPrice, 5000);    // preț la 5 secunde
  setInterval(loadStatus, 60000);  // status piață la 1 minut
  // reîncărcare la 3 ore
  setTimeout(function () { location.href = location.pathname; }, 3 * 60 * 60 * 1000);
</script>
</body>
</html>
